name: Import verified marketplace source

on:
  push:
    branches: [main]
    paths:
      - '.source_parts/**'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive, expand exact source, and run tests
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          source_dir = Path(".source_parts")
          expected = {f"chunk{i:02d}.txt": (1000 if i < 21 else 512) for i in range(22)}
          actual = {
              p.name: len(p.read_text(encoding="ascii").strip())
              for p in source_dir.glob("chunk*.txt")
          }
          if actual != expected:
              raise SystemExit(f"Chunk set/size mismatch: {actual}")

          encoded = "".join(
              (source_dir / name).read_text(encoding="ascii").strip()
              for name in expected
          )
          archive_bytes = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive_bytes).hexdigest()
          expected_digest = "20f082f304731ce0e86f79753a8680bc6e150e9c685bdc852c84ac8eccc83e06"
          if digest != expected_digest:
              raise SystemExit(f"Source archive checksum mismatch: {digest}")
          print(f"SHA-256 verified: {digest}")

          prefix = "marketplace_engine/"
          root = Path(".").resolve()
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:xz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("Archive is empty")
              for member in members:
                  if member.name not in {"marketplace_engine", "marketplace_engine/"} and not member.name.startswith(prefix):
                      raise SystemExit(f"Unexpected archive entry: {member.name}")
                  rel_name = "" if member.name.rstrip("/") == "marketplace_engine" else member.name[len(prefix):]
                  rel = PurePosixPath(rel_name)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe path in archive: {member.name}")
                  if member.issym() or member.islnk() or not (member.isdir() or member.isfile()):
                      raise SystemExit(f"Unsupported entry type: {member.name}")
                  if member.isdir() or not rel.parts:
                      continue
                  target = (root / Path(*rel.parts)).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"Archive path escapes repository: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"Cannot read: {member.name}")
                  target.write_bytes(stream.read())

          required = [
              Path("marketplace/main.py"),
              Path("marketplace/static/index.html"),
              Path("tests/test_marketplace.py"),
              Path("README.md"),
              Path("requirements.txt"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Required source files missing: {missing}")

          shutil.rmtree(source_dir)
          workflow_path = Path(".github/workflows/unpack-source.yml")
          workflow_path.unlink(missing_ok=True)
          print(f"Expanded {len(members)} archive entries ({len(archive_bytes)} bytes).")
          PY
          python -m pip install -r requirements.txt
          python -m compileall -q marketplace tests
          pytest -q

      - name: Commit exact validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace marketplace copy with verified full source and tests"
          git push

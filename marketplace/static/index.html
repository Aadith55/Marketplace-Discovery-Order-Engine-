<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace Discovery Demo</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#182230;background:#f4f6fa}body{margin:0}.top{background:#182b49;color:white;padding:24px max(18px,calc((100% - 1100px)/2))}.top h1{margin:0 0 6px}.top p{margin:0;color:#d1dced}.wrap{max-width:1100px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.filters,.cart{background:white;border:1px solid #e0e5ee;border-radius:12px;padding:16px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{padding:10px;border:1px solid #c6cfdd;border-radius:8px;min-width:130px;flex:1}.filters button,button{background:#155eef;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:600}.filters button:hover,button:hover{background:#0b4acb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #e0e5ee;border-radius:12px;padding:15px}.card h3{margin:0 0 6px;font-size:17px}.meta{color:#667085;font-size:13px}.price{font-size:21px;font-weight:750;margin:14px 0}.card input{width:60px;padding:7px;border:1px solid #c6cfdd;border-radius:6px;margin-right:6px}.cart{height:max-content;position:sticky;top:12px}.cart-row{border-bottom:1px solid #e8ecf2;padding:10px 0;font-size:14px}.total{font-size:20px;font-weight:750;margin:14px 0}.status{margin-top:12px;font-size:13px;line-height:1.4}.empty{color:#667085;padding:28px;background:white;border-radius:12px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.cart{position:static}}
</style></head>
<body>
<header class="top"><h1>Marketplace Discovery & Order Engine</h1><p>Search listings, compare offers, and place a demo order with inventory-safe checkout.</p></header>
<main class="wrap"><section><div class="filters"><input id="q" placeholder="Search listings..."><select id="category"><option value="">All categories</option><option>Books</option><option>Cameras</option><option>Electronics</option><option>Sports</option></select><input id="maxPrice" type="number" min="0" placeholder="Max price"><select id="sort"><option value="relevance">Best match</option><option value="price_asc">Price: low to high</option><option value="newest">Newest</option></select><button id="search">Search</button></div><div id="results" class="grid"></div></section>
<aside class="cart"><h2>Cart</h2><div id="cartItems" class="meta">Your cart is empty.</div><div id="total" class="total">$0.00</div><button id="checkout" style="width:100%">Place demo order</button><div id="status" class="status" role="status"></div><p class="meta">Demo only. No payment is processed. Orders use an idempotency key to make retries safe.</p></aside></main>
<script>
const cart=new Map();const PENDING_KEYS_STORAGE='marketplace.pendingOrderKeys.v1';function loadPendingOrderKeys(){try{const stored=JSON.parse(sessionStorage.getItem(PENDING_KEYS_STORAGE)||'{}');if(!stored||typeof stored!=='object'||Array.isArray(stored))return new Map();return new Map(Object.entries(stored).filter(([fingerprint,key])=>typeof fingerprint==='string'&&fingerprint.length<=4096&&typeof key==='string'&&/^[A-Za-z0-9-]{8,128}$/.test(key)).slice(-100))}catch{return new Map()}}const pendingOrderKeys=loadPendingOrderKeys();let activeSearch=null;const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n));
async function api(path,opts={}){const {headers:customHeaders={},...rest}=opts;const r=await fetch(path,{...rest,headers:{'Content-Type':'application/json',...customHeaders}});let d={};try{d=await r.json()}catch{}if(!r.ok){const error=new Error(d.detail||`Request failed (${r.status})`);error.status=r.status;throw error}return d}
function savePendingOrderKeys(){try{sessionStorage.setItem(PENDING_KEYS_STORAGE,JSON.stringify(Object.fromEntries(pendingOrderKeys)))}catch{}}
function makeIdempotencyKey(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();if(globalThis.crypto?.getRandomValues){const b=new Uint8Array(16);globalThis.crypto.getRandomValues(b);b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;const h=[...b].map(v=>v.toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`}throw new Error('Secure randomness is unavailable; checkout cannot safely create an idempotency key.') }
function cartRender(){const box=document.getElementById('cartItems');box.innerHTML='';let total=0;if(!cart.size){box.textContent='Your cart is empty.'}for(const [id,item] of cart){const row=document.createElement('div');row.className='cart-row';row.textContent=`${item.title} × ${item.qty} · ${money(item.price*item.qty)} `;const remove=document.createElement('button');remove.textContent='Remove';remove.style.marginLeft='6px';remove.onclick=()=>{cart.delete(id);cartRender()};row.append(remove);box.append(row);total+=item.price*item.qty}document.getElementById('total').textContent=money(total)}
function card(item){const el=document.createElement('article');el.className='card';const h=document.createElement('h3');h.textContent=item.title;const m=document.createElement('div');m.className='meta';m.textContent=`${item.category} · ${item.item_condition} · ${item.seller} · ${item.quantity} in stock`;const p=document.createElement('div');p.className='price';p.textContent=money(item.price);const d=document.createElement('p');d.textContent=item.description;const qty=document.createElement('input');qty.type='number';qty.min='1';qty.max=item.quantity;qty.value='1';qty.setAttribute('aria-label','Quantity');const b=document.createElement('button');b.textContent='Add to cart';b.onclick=()=>{const n=Number(qty.value);if(!Number.isInteger(n)||n<1||n>item.quantity){alert('Choose a quantity within available stock.');return}const old=cart.get(item.id);const next=(old?.qty||0)+n;if(next>item.quantity){alert('Cart quantity exceeds available stock.');return}cart.set(item.id,{...item,qty:next});cartRender()};el.append(h,m,p,d,qty,b);return el}
async function search(){if(activeSearch)activeSearch.abort();const controller=new AbortController();activeSearch=controller;const params=new URLSearchParams();const q=document.getElementById('q').value.trim();const category=document.getElementById('category').value;const max=document.getElementById('maxPrice').value;for(const [k,v] of Object.entries({q,category,max_price:max,sort:document.getElementById('sort').value}))if(v)params.set(k,v);try{const rows=await api('/listings?'+params,{signal:controller.signal});if(activeSearch!==controller)return;const box=document.getElementById('results');box.replaceChildren();if(!rows.length){box.textContent='No matching listings.';box.className='empty'}else{box.className='grid';rows.forEach(r=>box.append(card(r)))}}catch(e){if(e.name==='AbortError')return;document.getElementById('status').textContent=e.message}finally{if(activeSearch===controller)activeSearch=null}}
document.getElementById('search').onclick=search;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.getElementById('checkout').onclick=async()=>{const status=document.getElementById('status');if(!cart.size){status.textContent='Add at least one listing first.';return}const items=[...cart.entries()].map(([listing_id,item])=>({listing_id,quantity:item.qty})).sort((a,b)=>a.listing_id-b.listing_id);const payload={items};const fingerprint=JSON.stringify(payload);let key=null;try{key=pendingOrderKeys.get(fingerprint)||makeIdempotencyKey();pendingOrderKeys.delete(fingerprint);pendingOrderKeys.set(fingerprint,key);while(pendingOrderKeys.size>100)pendingOrderKeys.delete(pendingOrderKeys.keys().next().value);savePendingOrderKeys();const order=await api('/orders',{method:'POST',headers:{'Idempotency-Key':key},body:JSON.stringify(payload)});pendingOrderKeys.delete(fingerprint);savePendingOrderKeys();cart.clear();cartRender();await search();status.textContent=`Order #${order.id} confirmed. Total ${money(order.total)}. Inventory has been updated.`}catch(e){status.textContent=e.message+(key?' Retry keeps the same idempotency key.':'')}};
search();
</script></body></html>
